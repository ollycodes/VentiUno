<div class="leaderboard-prompt">
    <p>You made the leaderboard!</p>
    <form class="button-form" hx-post="{% url 'blackjack:leaderboard_submit' %}"
        hx-target="#table" hx-swap="innerHTML" method="post">
        {% csrf_token %}
        {{ form.as_div }}
        <input class="button" type="submit" value="Submit score"/>
    </form>
</div>
